<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mappin - ログイン</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-page { padding: 28px 16px; }
    .login-heading { margin: 18px 0 8px; font-size: 24px; }
    .login-copy { margin: 0 0 22px; color: #68717c; font-size: 13px; }
    .login-label { display: block; margin: 16px 0 7px; font-size: 13px; font-weight: 700; }
    .login-input { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid #d2d6da; border-radius: 5px; }
    .login-submit { width: 100%; min-height: 44px; margin-top: 22px; border: 1px solid #222; border-radius: 5px; color: #fff; background: #222; font-weight: 700; }
  </style>
</head>
<body>
  <div class="app">
    <main class="login-page">
      <h1 class="login-heading">mappinにログイン</h1>
      <p class="login-copy">アカウントにログインして、周辺のおすすめを見つけましょう。</p>
      <form>
        <label class="login-label" for="loginEmail">メールアドレス</label>
        <input id="loginEmail" class="login-input" type="email" autocomplete="email">
        <label class="login-label" for="loginPassword">パスワード</label>
        <input id="loginPassword" class="login-input" type="password" autocomplete="current-password">
        <button class="login-submit" type="button">ログイン</button>
      </form>
    </main>
  </div>
</body>
</html>
