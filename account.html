<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <title>mappin - アカウント</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="app-icon-180.png">
  <link rel="stylesheet" href="style.css">
  <script src="pwa.js" defer></script>
  <style>
    .logout-button { width: 100%; min-height: 44px; margin-top: 8px; border: 1px solid #d94b4b; border-radius: 5px; color: #c43131; background: #fff; font-weight: 700; }
    .logout-button:hover { background: #fff5f5; }
    .confirm-overlay { position: fixed; z-index: 10; inset: 0; display: none; place-items: center; padding: 20px; background: #0006; }
    .confirm-overlay.visible { display: grid; }
    .confirm-dialog { width: min(100%, 340px); padding: 22px; border-radius: 10px; background: #fff; box-shadow: 0 8px 30px #0003; text-align: center; }
    .confirm-dialog h2 { margin: 0; font-size: 17px; }
    .confirm-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
    .confirm-actions button { min-height: 40px; border-radius: 5px; font-weight: 700; }
    .confirm-no { border: 1px solid #ccc; color: #333; background: #fff; }
    .confirm-yes { border: 1px solid #c43131; color: #fff; background: #c43131; }
  </style>
</head>
<body data-page="account">
  <div class="app">
    <header class="app-header">
      <div class="app-brand">
        <img class="app-logo" src="logo.png" alt="">
        <span class="app-brand-name">マッピン</span>
      </div>
      <button class="notification-button" id="notification-button" type="button" aria-label="通知" aria-expanded="false">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
        </svg>
        <span class="notification-dot" aria-hidden="true"></span>
      </button>
      <div class="notification-panel" id="notification-panel" hidden>
        <strong>通知</strong>
        <p><span>♡</span> あなたの投稿にいいねがありました</p>
        <p><span>＋</span> 新しいおすすめ投稿があります</p>
      </div>
    </header>
    <main>
      <h1 class="page-title">アカウント</h1>
      <div class="card"><strong>ゲストユーザー</strong><p class="muted">アカウント設定</p></div>
      <div class="card">プロフィール</div>
      <div class="card">通知設定</div>
      <div class="card">ヘルプ</div>
      <button id="logoutButton" class="logout-button" type="button">ログアウト</button>
    </main>
    <div id="logoutConfirm" class="confirm-overlay" role="presentation">
      <div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <h2 id="confirmTitle">本当にログアウトしますか？</h2>
        <div class="confirm-actions">
          <button id="cancelLogout" class="confirm-no" type="button">いいえ</button>
          <button id="confirmLogout" class="confirm-yes" type="button">はい</button>
        </div>
      </div>
    </div>
    <nav aria-label="メインナビゲーション">
      <a href="index.html" aria-label="ホーム"><span aria-hidden="true">⌂</span></a>
      <a href="inspect.html" aria-label="検査"><span aria-hidden="true">⌕</span></a>
      <a href="ai.html" aria-label="AIと相談"><span class="ai-tab-icon" aria-hidden="true">✦</span></a>
      <a href="dm.html" aria-label="DM"><span class="dm-tab-icon" aria-hidden="true">✉</span></a>
      <a href="account.html" aria-label="アカウント" aria-current="page"><span aria-hidden="true">○</span></a>
    </nav>
    <a class="post-float-button" href="post.html" aria-label="投稿を作成">＋</a>
  </div>
  <script>
    const logoutButton = document.querySelector('#logoutButton');
    const logoutConfirm = document.querySelector('#logoutConfirm');
    const cancelLogout = document.querySelector('#cancelLogout');
    const confirmLogout = document.querySelector('#confirmLogout');

    logoutButton.addEventListener('click', () => {
      logoutConfirm.classList.add('visible');
      confirmLogout.focus();
    });

    cancelLogout.addEventListener('click', () => {
      logoutConfirm.classList.remove('visible');
      logoutButton.focus();
    });

    confirmLogout.addEventListener('click', () => {
      logoutConfirm.classList.remove('visible');
      logoutButton.disabled = true;
      logoutButton.textContent = 'ログアウトしています...';
      setTimeout(() => { window.location.href = 'logout.html'; }, 500);
    });
  </script>
</body>
</html>
