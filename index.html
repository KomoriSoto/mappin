<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mappin - ホーム</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body data-page="home">
  <div class="app">
    <header>mappin</header>
    <main>
      <div class="map" id="map" role="region" aria-label="投稿ピンと現在地を表示したマップ">
        <span class="map-label" style="left: 12%; top: 17%">中央公園</span>
        <span class="map-label" style="right: 12%; top: 49%">駅前通り</span>
        <span class="map-label" style="left: 23%; bottom: 15%">さくら通り</span>
        <div class="map-post map-post--orange" style="left: 28%; top: 32%">
          <span class="comment-bubble"><span class="comment-icon" aria-hidden="true">🍔</span>月見バーガーうめぇ</span>
          <span class="pin" title="月見バーガーうめぇ"></span>
        </div>
        <div class="map-post map-post--purple" style="left: 70%; top: 26%">
          <span class="comment-bubble"><span class="comment-icon" aria-hidden="true">🛍️</span>ちいかわのコラボグッズまだあります</span>
          <span class="pin" title="ちいかわのコラボグッズまだあります"></span>
        </div>
        <div class="map-post map-post--green" style="left: 61%; top: 70%">
          <span class="comment-bubble"><span class="comment-icon" aria-hidden="true">🌸</span>公園の花が咲いています</span>
          <span class="pin" title="公園の花が咲いています"></span>
        </div>
        <span class="pin current" style="left: 47%; top: 52%" title="現在地"></span>
      </div>
    </main>
    <nav aria-label="メインナビゲーション">
      <a href="index.html" aria-label="ホーム" aria-current="page"><span aria-hidden="true">⌂</span></a>
      <a href="inspect.html" aria-label="検査"><span aria-hidden="true">⌕</span></a>
      <a href="post.html" aria-label="投稿"><span aria-hidden="true">＋</span></a>
      <a href="account.html" aria-label="アカウント"><span aria-hidden="true">○</span></a>
    </nav>
  </div>
</body>
</html>
