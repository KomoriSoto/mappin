<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <title>mappin - 投稿を作成</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="app-icon-180.png">
  <link rel="stylesheet" href="style.css">
  <script src="pwa.js" defer></script>
  <style>
    .profile-row { display: flex; gap: 12px; align-items: flex-start; }
    .avatar { display: grid; flex: 0 0 42px; width: 42px; height: 42px; place-items: center; border-radius: 50%; color: #fff; background: #3786e8; font-weight: 700; }
    .identity { margin: 2px 0 10px; }
    .identity strong { display: block; }
    .identity span { color: #777; font-size: 13px; }
    .post-input { min-height: 126px; border: 0; padding: 0; outline: 0; font-size: 17px; }
    .post-input:focus { border: 0; }
    .cancel-button { margin: 4px 0 16px; padding: 0; border: 0; color: #2868ae; background: transparent; font-size: 15px; cursor: pointer; }
    .mobile-keyboard { margin: 16px -16px -16px; padding: 8px 5px 10px; border-top: 1px solid #c9c9c9; background: #dfe2e7; }
    .keyboard-toolbar { display: flex; justify-content: space-between; align-items: center; min-height: 24px; padding: 0 6px 6px; color: #69717c; font-size: 12px; }
    .keyboard-keys { display: grid; gap: 6px 4px; }
    .keyboard-row { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
    .keyboard-row:nth-child(2) { padding: 0 13px; }
    .keyboard-row:nth-child(3) { padding: 0 28px; }
    .keyboard-key { min-width: 0; height: 38px; padding: 0; border: 0; border-radius: 4px; color: #25272b; background: #fff; box-shadow: 0 1px 1px #8d9299; font-size: 16px; }
    .keyboard-key--wide { grid-column: span 2; }
    .keyboard-key--space { grid-column: span 6; font-size: 12px; }
    .keyboard-key--dark { color: #fff; background: #aeb3bb; }
    .reply-setting { display: inline-block; margin-top: 8px; padding: 6px 10px; border: 1px solid #b9d5f5; border-radius: 5px; color: #2868ae; background: #f1f7ff; font-size: 12px; }
    .media-preview { position: relative; display: none; margin-top: 12px; }
    .media-preview.visible { display: block; }
    .media-preview img { display: block; width: 100%; max-height: 280px; object-fit: cover; border: 1px solid #ddd; border-radius: 5px; }
    .remove-media, .remove-location { border: 0; background: transparent; cursor: pointer; }
    .remove-media { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; color: #fff; background: #222c; font-size: 20px; }
    .tool-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ddd; }
    .tool-button { display: grid; width: 38px; height: 38px; place-items: center; border: 0; border-radius: 5px; color: #2868ae; background: #f1f7ff; cursor: pointer; }
    .tool-button input { display: none; }
    .tool-image { font-size: 20px; line-height: 1; }
    .tool-image::before { content: "▧"; }
    .location-button { width: auto; padding: 0 10px; gap: 5px; font-size: 12px; }
    .location-button:disabled { cursor: wait; opacity: .65; }
    .counter { margin-left: auto; color: #777; font-size: 12px; }
    .counter.warning { color: #b66a00; }
    .counter.error { color: #c22; font-weight: 700; }
    .post-button { min-height: 38px; margin-left: 4px; padding: 0 16px; border: 1px solid #222; border-radius: 5px; color: #fff; background: #222; font-weight: 700; }
    .post-button:disabled { cursor: not-allowed; opacity: .45; }
    .location-card { display: none; align-items: center; gap: 10px; margin-top: 12px; padding: 11px 12px; border: 1px solid #c9ebdc; border-radius: 5px; color: #176b53; background: #f0fbf6; }
    .location-card.visible { display: flex; }
    .location-copy { min-width: 0; flex: 1; }
    .location-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 700; }
    .location-coordinates { margin-top: 2px; color: #5b897a; font-size: 10px; }
    .floor-select { padding: 6px; border: 1px solid #a9d9c7; border-radius: 5px; color: #176b53; background: #fff; font-size: 11px; }
    .remove-location { width: 26px; height: 26px; color: #176b53; font-size: 18px; }
    .toast { min-height: 20px; margin: 10px 0 0; color: #38804a; font-size: 13px; }

    @media (prefers-color-scheme: dark) {
      .reply-setting, .tool-button { background: #1b2a3b; }
      .location-card, .location-card.visible { border-color: #285643; color: #a4dbc3; background: #152820; }
      .location-coordinates { color: #8bb9a5; }
      .floor-select { border-color: #386b56; color: #a4dbc3; background: #202a25; }
      .counter { color: #aaa; }
      .counter.warning { color: #f0b44d; }
      .counter.error { color: #ff7777; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-brand">
        <img class="app-logo" src="logo.png" alt="">
        <span class="app-brand-name">マッピン</span>
      </div>
      <button class="notification-button" id="notification-button" type="button" aria-label="通知" aria-expanded="false">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
        </svg>
        <span class="notification-dot" aria-hidden="true"></span>
      </button>
      <div class="notification-panel" id="notification-panel" hidden>
        <strong>通知</strong>
        <p><span>♡</span> あなたの投稿にいいねがありました</p>
        <p><span>＋</span> 新しいおすすめ投稿があります</p>
      </div>
    </header>
    <main>
      <button class="cancel-button" type="button">キャンセル</button>
      <section class="card" aria-label="投稿フォーム">
        <div class="profile-row">
          <div class="avatar" aria-hidden="true">Y</div>
          <div style="flex: 1">
            <div class="identity"><strong>Yuki Tanaka</strong><span>@yuki_design</span></div>
            <textarea id="postInput" class="post-input" maxlength="280" placeholder="ここに文字を入力"></textarea>
            <div class="reply-setting">◉ 全員が返信できます</div>
          </div>
        </div>

        <div id="mediaPreview" class="media-preview">
          <img id="previewImage" alt="選択した画像のプレビュー">
          <button id="removeMedia" class="remove-media" type="button" aria-label="画像を削除">×</button>
        </div>

        <div class="tool-row">
          <label class="tool-button" title="画像を追加">
            <span class="tool-image" aria-hidden="true"></span>
            <input id="imageInput" type="file" accept="image/*">
          </label>
          <button id="locationButton" class="tool-button location-button" type="button">📍 現在地</button>
          <span id="counter" class="counter">0 / 280</span>
          <button id="postButton" class="post-button" type="button" disabled>投稿</button>
        </div>

        <div id="locationCard" class="location-card" aria-live="polite">
          <span aria-hidden="true">📍</span>
          <div class="location-copy">
            <div id="locationName" class="location-name">現在地を取得中...</div>
            <div id="locationCoordinates" class="location-coordinates"></div>
          </div>
          <select id="floorSelect" class="floor-select" aria-label="階数">
            <option value="">階数</option><option>地下1階</option><option>1階</option><option>2階</option><option>3階</option><option>4階</option><option>5階以上</option>
          </select>
          <button id="removeLocation" class="remove-location" type="button" aria-label="現在地を削除">×</button>
        </div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </section>

      <div class="mobile-keyboard" aria-label="スマートフォンのキーパッド">
        <div class="keyboard-toolbar"><span>あいう</span><span>⌃</span></div>
        <div class="keyboard-keys" aria-hidden="true">
          <div class="keyboard-row">
            <button class="keyboard-key" type="button">あ</button><button class="keyboard-key" type="button">か</button><button class="keyboard-key" type="button">さ</button><button class="keyboard-key" type="button">た</button><button class="keyboard-key" type="button">な</button><button class="keyboard-key" type="button">は</button><button class="keyboard-key" type="button">ま</button><button class="keyboard-key" type="button">や</button><button class="keyboard-key" type="button">ら</button><button class="keyboard-key" type="button">わ</button>
          </div>
          <div class="keyboard-row">
            <button class="keyboard-key" type="button">か</button><button class="keyboard-key" type="button">き</button><button class="keyboard-key" type="button">く</button><button class="keyboard-key" type="button">け</button><button class="keyboard-key" type="button">こ</button><button class="keyboard-key" type="button">、</button><button class="keyboard-key" type="button">。</button><button class="keyboard-key" type="button">？</button><button class="keyboard-key keyboard-key--dark" type="button">⌫</button><button class="keyboard-key keyboard-key--dark" type="button">↵</button>
          </div>
          <div class="keyboard-row">
            <button class="keyboard-key keyboard-key--dark keyboard-key--wide" type="button">123</button><button class="keyboard-key keyboard-key--space" type="button">空白</button><button class="keyboard-key keyboard-key--dark keyboard-key--wide" type="button">確定</button>
          </div>
        </div>
      </div>
    </main>
    <nav aria-label="メインナビゲーション">
      <a href="index.html" aria-label="ホーム"><span aria-hidden="true">⌂</span></a>
      <a href="inspect.html" aria-label="検査"><span aria-hidden="true">⌕</span></a>
      <a href="post.html" aria-label="投稿" aria-current="page"><span aria-hidden="true">＋</span></a>
      <a href="account.html" aria-label="アカウント"><span aria-hidden="true">○</span></a>
    </nav>
  </div>

  <script>
    const input = document.querySelector('#postInput');
    const counter = document.querySelector('#counter');
    const postButton = document.querySelector('#postButton');
    const imageInput = document.querySelector('#imageInput');
    const mediaPreview = document.querySelector('#mediaPreview');
    const previewImage = document.querySelector('#previewImage');
    const locationButton = document.querySelector('#locationButton');
    const locationCard = document.querySelector('#locationCard');
    const locationName = document.querySelector('#locationName');
    const locationCoordinates = document.querySelector('#locationCoordinates');
    let currentCoordinates = null;
    let currentAreaName = '現在地周辺';
    let toastTimer;

    function updateComposer() {
      const length = [...input.value].length;
      counter.textContent = `${length} / 280`;
      counter.className = `counter${length > 250 ? ' warning' : ''}${length > 280 ? ' error' : ''}`;
      postButton.disabled = length === 0 || length > 280;
    }

    function showToast(message) {
      const toast = document.querySelector('#toast');
      toast.textContent = message;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.textContent = ''; }, 2200);
    }

    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0];
      if (!file) return;
      previewImage.src = URL.createObjectURL(file);
      mediaPreview.classList.add('visible');
      showToast('画像を追加しました');
    });

    document.querySelector('#removeMedia').addEventListener('click', () => {
      imageInput.value = '';
      previewImage.removeAttribute('src');
      mediaPreview.classList.remove('visible');
    });

    input.addEventListener('input', updateComposer);
    locationButton.addEventListener('click', () => {
      if (!navigator.geolocation) {
        showToast('この端末では現在地を取得できません');
        return;
      }
      locationButton.disabled = true;
      locationButton.textContent = '取得中...';
      locationCard.classList.add('visible');
      navigator.geolocation.getCurrentPosition(async ({ coords }) => {
        currentCoordinates = { latitude: coords.latitude, longitude: coords.longitude };
        updateComposer();
        locationCoordinates.textContent = `${coords.latitude.toFixed(5)}, ${coords.longitude.toFixed(5)}`;
        locationName.textContent = '現在地（住所を確認中）';
        try {
          const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${coords.latitude}&lon=${coords.longitude}&zoom=18&accept-language=ja`);
          if (!response.ok) throw new Error('住所取得失敗');
          const place = await response.json();
          locationName.textContent = place.display_name || '現在地';
          const address = place.address || {};
          currentAreaName = address.suburb || address.neighbourhood || address.city_district || address.town || address.city || address.county || '現在地周辺';
        } catch (error) {
          locationName.textContent = '現在地（住所を取得できませんでした）';
          currentAreaName = '現在地周辺';
        }
        locationButton.disabled = false;
        locationButton.textContent = '📍 現在地';
        showToast('現在地を追加しました。階数も選べます');
      }, () => {
        locationCard.classList.remove('visible');
        locationButton.disabled = false;
        locationButton.textContent = '📍 現在地';
        showToast('位置情報の利用を許可してください');
      }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
    });

    document.querySelector('#removeLocation').addEventListener('click', () => {
      locationCard.classList.remove('visible');
      locationCoordinates.textContent = '';
      currentCoordinates = null;
      currentAreaName = '現在地周辺';
      document.querySelector('#floorSelect').value = '';
      updateComposer();
    });

    postButton.addEventListener('click', () => {
      const posts = JSON.parse(localStorage.getItem('mappin-posts') || '[]');
      const coords = currentCoordinates;
      const areaId = coords
        ? `area:${Math.round(coords.latitude / 0.002)}:${Math.round(coords.longitude / (0.002 * Math.cos(coords.latitude * Math.PI / 180)))}`
        : 'area:nearby';
      const post = {
        id: `post-${Date.now()}`,
        text: input.value.trim(),
        locationEnabled: Boolean(coords),
        locationId: areaId,
        areaId,
        locationName: currentAreaName,
        areaName: currentAreaName,
        placeId: '',
        placeName: '',
        category: 'local',
        latitude: coords?.latitude ?? null,
        longitude: coords?.longitude ?? null,
        x: 20 + Math.random() * 60,
        y: 20 + Math.random() * 60,
        color: ['red', 'orange', 'purple', 'green', 'blue'][posts.length % 5],
        icon: '💬',
        author: 'Yuki Tanaka',
        avatar: 'Y',
        photo: '',
        likes: 0,
        createdAt: Date.now()
      };
      posts.unshift(post);
      localStorage.setItem('mappin-posts', JSON.stringify(posts));
      showToast('投稿しました');
      input.value = '';
      imageInput.value = '';
      previewImage.removeAttribute('src');
      mediaPreview.classList.remove('visible');
      locationCard.classList.remove('visible');
      currentCoordinates = null;
      currentAreaName = '現在地周辺';
      updateComposer();
    });

    updateComposer();
  </script>
</body>
</html>
