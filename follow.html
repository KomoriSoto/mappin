<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <title>mappin - フォロー・フォロワー</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="app-icon-180.png">
  <link rel="stylesheet" href="style.css">
  <script src="pwa.js" defer></script>
  <link rel="stylesheet" href="profile.css">
  <script src="profile.js"></script>
</head>
<body data-page="account">
  <div class="app">
    <header class="app-header">
      <div class="app-brand">
        <img class="app-logo" src="logo.png" alt="">
        <span class="app-brand-name">マッピン</span>
      </div>
      <button class="notification-button" id="notification-button" type="button" aria-label="通知" aria-expanded="false">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
        </svg>
        <span class="notification-dot" aria-hidden="true"></span>
      </button>
      <div class="notification-panel" id="notification-panel" hidden>
        <strong>通知</strong>
        <p><span>♡</span> あなたの投稿にいいねがありました</p>
        <p><span>＋</span> 新しいおすすめ投稿があります</p>
      </div>
    </header>
    <main>
      <div class="sub-header">
        <a class="back-link" href="account.html">‹ 戻る</a>
        <h1 id="followTitle">ゲストユーザー</h1>
        <span></span>
      </div>
      <div class="follow-tabs" role="tablist" aria-label="フォロー・フォロワーの切り替え">
        <button class="profile-tab" id="tabFollowers" type="button" role="tab" aria-selected="false">フォロワー <span id="followerCount">0</span></button>
        <button class="profile-tab" id="tabFollowing" type="button" role="tab" aria-selected="true">フォロー中 <span id="followingCount">0</span></button>
      </div>
      <div id="userList" class="user-list" role="tabpanel"></div>
    </main>
    <div id="profileToast" class="profile-toast" role="status" aria-live="polite"></div>
    <nav aria-label="メインナビゲーション">
      <a href="index.html" aria-label="ホーム"><span aria-hidden="true">⌂</span></a>
      <a href="inspect.html" aria-label="検査"><span aria-hidden="true">⌕</span></a>
      <a href="ai.html" aria-label="AIと相談"><span class="ai-tab-icon" aria-hidden="true">✦</span></a>
      <a href="dm.html" aria-label="DM"><span class="dm-tab-icon" aria-hidden="true">✉</span></a>
      <a href="account.html" aria-label="アカウント" aria-current="page"><span aria-hidden="true">○</span></a>
    </nav>
    <a class="post-float-button" href="post.html" aria-label="投稿を作成">＋</a>
  </div>
  <script>
    const userList = document.querySelector('#userList');
    let currentTab = new URLSearchParams(location.search).get('tab') === 'followers' ? 'followers' : 'following';
    document.querySelector('#followTitle').textContent = readProfile().name;

    function createUserRow(user, following) {
      const row = document.createElement('div');
      row.className = 'user-row';
      const copy = document.createElement('div');
      copy.className = 'user-copy';
      const name = document.createElement('strong');
      name.textContent = user.author;
      const bio = document.createElement('span');
      bio.textContent = user.bio || '';
      copy.append(name, bio);

      const button = document.createElement('button');
      button.type = 'button';
      button.className = `feed-follow${following.has(user.author) ? ' is-following' : ''}`;
      button.textContent = following.has(user.author) ? 'フォロー中' : (currentTab === 'followers' ? 'フォローバック' : 'フォロー');
      button.addEventListener('click', () => {
        const list = new Set(readFollowingList());
        if (list.has(user.author)) {
          list.delete(user.author);
          showProfileToast(`${user.author}さんのフォローを外しました`);
        } else {
          list.add(user.author);
          showProfileToast(`${user.author}さんをフォローしました`);
        }
        saveFollowingList([...list]);
        render();
      });
      row.append(createAvatar(user.avatar), copy, button);
      return row;
    }

    function render() {
      const following = new Set(readFollowingList());
      document.querySelector('#followerCount').textContent = sampleFollowers.length;
      document.querySelector('#followingCount').textContent = following.size;
      document.querySelector('#tabFollowers').setAttribute('aria-selected', String(currentTab === 'followers'));
      document.querySelector('#tabFollowing').setAttribute('aria-selected', String(currentTab === 'following'));

      const users = currentTab === 'followers'
        ? sampleFollowers
        : [...following].map((author) => ({
          author,
          avatar: findAvatar(author),
          bio: (sampleFollowers.find((user) => user.author === author) || {}).bio || ''
        }));
      userList.replaceChildren();
      if (users.length === 0) {
        userList.innerHTML = currentTab === 'followers'
          ? '<div class="empty-state"><span class="empty-icon" aria-hidden="true">👤</span>まだフォロワーはいません</div>'
          : '<div class="empty-state"><span class="empty-icon" aria-hidden="true">👤</span>まだ誰もフォローしていません<br>投稿の「フォロー」を押すとここに出ます<br><a href="index.html">マップで投稿を探す</a></div>';
        return;
      }
      users.forEach((user) => userList.append(createUserRow(user, following)));
    }

    document.querySelector('#tabFollowers').addEventListener('click', () => { currentTab = 'followers'; render(); });
    document.querySelector('#tabFollowing').addEventListener('click', () => { currentTab = 'following'; render(); });
    render();
  </script>
</body>
</html>
